<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" role="img" aria-label="SecPosture System Architecture">
  <rect width="1160" height="660" fill="#FAF7F2"/>
  <rect x="20" y="20" width="1120" height="135" fill="#FFFFFF" stroke="#18181B" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="38" y="46" font-family="sans-serif" font-size="15" font-weight="800" fill="#B91C1C">1. Browser UI and Serverless AWS Edge (CloudFront + Private S3 OAC + AWS Lambda)</text>
  <rect x="40" y="64" width="230" height="72" fill="#DBEAFE" stroke="#18181B" stroke-width="2"/>
  <text x="155" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#18181B">Builder &amp; AppSec Browser</text>
  <text x="155" y="116" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1E3A8A">4 Live Views · URL Hash State</text>
  <rect x="320" y="64" width="240" height="72" fill="#FEE2E2" stroke="#18181B" stroke-width="2"/>
  <text x="440" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#18181B">Amazon CloudFront</text>
  <text x="440" y="116" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#991B1B">/* -&gt; S3 OAC · /api/* -&gt; Lambda</text>
  <rect x="610" y="64" width="235" height="72" fill="#DCFCE7" stroke="#18181B" stroke-width="2"/>
  <text x="727" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#18181B">Private S3 Bucket (OAC)</text>
  <text x="727" y="116" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#065F46">Public Access Blocked</text>
  <rect x="885" y="64" width="235" height="72" fill="#FEF3C7" stroke="#18181B" stroke-width="2"/>
  <text x="1002" y="94" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#18181B">AWS Lambda</text>
  <text x="1002" y="116" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#92400E">secposture/server.py</text>

  <rect x="20" y="180" width="1120" height="145" fill="#FFF1F2" stroke="#B91C1C" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="38" y="206" font-family="sans-serif" font-size="15" font-weight="800" fill="#B91C1C">2. Reachability &amp; Cloud Attack-Path Analyzers</text>
  <rect x="40" y="224" width="340" height="82" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
  <text x="210" y="254" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#18181B">AST Call-Graph &amp; Taint Scanner</text>
  <text x="210" y="276" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#B91C1C">reachability_ast.py · Separates Dead Code</text>
  <rect x="410" y="224" width="340" height="82" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
  <text x="580" y="254" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#18181B">Multi-Hop IAM Attack-Path Solver</text>
  <text x="580" y="276" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1E3A8A">attack_graph.py · PassRole &amp; AssumeRole</text>
  <rect x="780" y="224" width="340" height="82" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
  <text x="950" y="254" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#18181B">CloudTrail Kill-Chain Detector</text>
  <text x="950" y="276" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#065F46">Recon -&gt; Creds -&gt; Lateral -&gt; Exfil</text>

  <rect x="20" y="350" width="1120" height="145" fill="#F0FDF4" stroke="#065F46" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="38" y="376" font-family="sans-serif" font-size="15" font-weight="800" fill="#065F46">3. Closed-Loop Auto-Patching &amp; Isolated /tmp Verification Gates</text>
  <rect x="40" y="394" width="340" height="82" fill="#DCFCE7" stroke="#18181B" stroke-width="2"/>
  <text x="210" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#18181B">Minimal Code &amp; IAM Patcher</text>
  <text x="210" y="446" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#065F46">autopatch_loop.py · ? SQL · shell=False</text>
  <rect x="410" y="394" width="340" height="82" fill="#DBEAFE" stroke="#18181B" stroke-width="2"/>
  <text x="580" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#18181B">AST Re-Scan Gate (0 Reachable)</text>
  <text x="580" y="446" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1E3A8A">Proves vulnerability elimination</text>
  <rect x="780" y="394" width="340" height="82" fill="#FEF3C7" stroke="#18181B" stroke-width="2"/>
  <text x="950" y="424" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#18181B">Isolated /tmp Unittest Gate</text>
  <text x="950" y="446" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#92400E">100% behavioral tests required</text>

  <rect x="20" y="520" width="545" height="115" fill="#F3E8FF" stroke="#18181B" stroke-width="2"/>
  <text x="292" y="558" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#5B21B6">4. Amazon Bedrock STRIDE Threat Modeler</text>
  <text x="292" y="584" text-anchor="middle" font-family="monospace" font-size="11" fill="#18181B">us.amazon.nova-lite-v1:0 · Converse API</text>
  <text x="292" y="608" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#4C1D95">Anchors launch reviews to file:line &amp; IAM ARNs</text>

  <rect x="595" y="520" width="545" height="115" fill="#FEF3C7" stroke="#18181B" stroke-width="2"/>
  <text x="867" y="558" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#92400E">4. SHA-256 Hash-Chained Audit Ledger</text>
  <text x="867" y="584" text-anchor="middle" font-family="monospace" font-size="11" fill="#18181B">SQLite WAL · audit_ledger.py</text>
  <text x="867" y="608" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#78350F">Tamper-evident scan, patch &amp; containment receipts</text>
</svg>
